org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Compiled against the newest version of the range. 1.21.6 rewrote the render
# stack and 1.21.9 rewrote the GUI, so this jar stops at 1.21.8 rather than
# pretend to cover either side of those walls.
minecraft_version=1.21.8
yarn_mappings=1.21.8+build.1
loader_version=0.19.3
loom_version=1.11.8

# The range this jar declares support for. Verified member by member against the
# intermediary mappings of every version in it: see tools/CompatCheck.java, which
# reads the built jar and asks each version whether it has everything the jar
# names, with the signatures it names them by.
minecraft_range=>=1.21.6 <1.21.9

mod_version=2.0.8
maven_group=com.glamardor
archives_base_name=roleplayers-quill

fabric_api_version=0.136.1+1.21.8
modmenu_version=15.0.2
cloth_config_version=19.0.147

# Offline speech recognition, downloaded on demand rather than shipped. Only the
# tar.bz2 reader rides along inside the jar; the engine and the model do not.
commons_compress_version=1.28.0
