org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# From 26.1 Minecraft ships without obfuscation: there are no yarn or intermediary mappings
# for this line, the game is compiled against Mojang's own names, and it needs Java 25. That
# is why this jar cannot share its source with the 1.21 build in the repository root: the
# sources here are the root's, moved to Mojang's names with loom's migrateMappings and then
# brought forward to 26.3.
minecraft_version=26.3
loader_version=0.20.1
loom_version=1.19.1

minecraft_range=>=26.3 <26.4

mod_version=2.9.6
maven_group=com.glamardor
archives_base_name=roleplayers-quill

fabric_api_version=0.166.2+26.3
modmenu_version=21.0.1
cloth_version=26.3.159+fabric

commons_compress_version=1.28.0
